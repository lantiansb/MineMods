plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '{{mdg_version}}'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"
    if (project.parchment_mappings_version) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${project.mod_id}" { sourceSet(sourceSets.main) }
    }
}

// Forge 1.20.1 runs the game obfuscated: Mixin needs a refmap, written by its annotation processor. Only a mod
// that has mixins gets one: with none, the processor writes no mappings and reobfJar would fail looking for them.
def mixinConfig = file("src/main/resources/${project.mod_id}.mixins.json")
def hasMixins = mixinConfig.exists() && new groovy.json.JsonSlurper().parse(mixinConfig).with { config -> ['mixins', 'client', 'server'].any { config[it] } }
if (hasMixins) {
    mixin {
        add sourceSets.main, "${project.mod_id}.refmap.json"
        config "${project.mod_id}.mixins.json"
    }
    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }
    jar {
        manifest { attributes('MixinConfigs': "${project.mod_id}.mixins.json") }
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = project.geckolib_repository
        content { includeGroup('software.bernie.geckolib') }
    }
}

dependencies {
    modImplementation project.geckolib_coordinate
}

processResources {
    inputs.property "version", project.version
    // The filter reads and writes text in the platform charset unless told: on a Chinese Windows (GBK) the UTF-8 name and description came out with ? in them.
    filteringCharset = "UTF-8"
    filesMatching("META-INF/mods.toml") {
        filter { line -> line.replace('${version}', project.version.toString()) }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(project.java_version)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
